server {
  listen 80;
  server_name _;

  # =============================================================================
  # CONFIGURACIÓN GENERAL
  # =============================================================================
  #
  # Ajustes base del servidor y del sitio estático.
  #

  # Eleva el límite de subida a 50MB para soportar los adjuntos (PDFs de
  # manuales técnicos) manejados por el módulo de documentos.
  client_max_body_size 50M;

  root /usr/share/nginx/html;
  index index.html;

  # =============================================================================
  # INTEGRACIONES — PROXY REVERSO
  # =============================================================================
  #
  # Enruta las solicitudes hacia el backend central y hacia el motor local
  # de LM Studio, preservando las cabeceras necesarias para trazabilidad.
  #

  location /api/ {
    proxy_pass http://backend:9000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 120s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;
  }

  location /lm/ {
    proxy_pass http://host.docker.internal:1234/lm/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # =============================================================================
  # ENRUTAMIENTO SPA
  # =============================================================================
  #
  # Sirve index.html para cualquier ruta que no corresponda a un archivo
  # estático existente, delegando el enrutamiento al router de React.
  #

  location / {
    try_files $uri $uri/ /index.html;
  }
}
