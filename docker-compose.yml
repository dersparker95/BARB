version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: barb_postgres_db
    environment:
      POSTGRES_USER: barb_admin
      POSTGRES_PASSWORD: barb_password123
      POSTGRES_DB: barb_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initScripts:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barb_admin -d barb_database"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    container_name: barb_backend
    ports:
      - "9000:9000"
    environment:
      - DATABASE_URL=postgresql://barb_admin:barb_password123@db:5432/barb_database
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: frontend/dockerfile
    container_name: barb_main_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
